<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Workspace V6 — Hybrid Research Desk</title>
<meta name="theme-color" content="#0b1220">
<style>
:root{--bg:#09111d;--bg2:#0c1624;--panel:#101b2b;--panel2:#0d1725;--line:#223249;--line2:#2d4160;--text:#e8eef8;--muted:#8fa3bd;--blue:#3b82f6;--green:#22c58b;--red:#ff5b6e;--yellow:#f3b94e;--shadow:0 16px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.ltr{direction:ltr}.app{height:100%;display:grid;grid-template-rows:56px 1fr 34px}.topbar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);background:#0a1320;direction:ltr}.brand{display:flex;align-items:center;gap:9px;font-weight:800;white-space:nowrap}.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#2b67e8,#55a5ff);font-size:13px}.badge{font-size:10px;color:#9cc7ff;border:1px solid #31577d;border-radius:999px;padding:3px 7px}.search{flex:1;max-width:520px;min-width:120px;background:#08111c;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px}.toolbar{margin-left:auto;display:flex;gap:6px}.btn{border:1px solid var(--line);background:#111d2d;color:var(--text);border-radius:8px;padding:8px 10px;min-height:36px}.btn:hover{border-color:var(--line2);background:#162338}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.active{outline:1px solid #5d96ff;background:#17345f}.marketstrip{position:absolute;left:58px;right:0;top:56px;height:28px;background:#0a1320;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 12px;font-size:11px;direction:ltr;z-index:20}.marketstrip b{font-weight:700}.pos{color:var(--green)}.neg{color:var(--red)}
.body{min-height:0;display:grid;grid-template-columns:58px 1fr;padding-top:28px}.rail{background:#0a1320;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:9px 5px;gap:7px;direction:ltr}.rail button{width:44px;height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:10px}.rail button:hover,.rail button.active{background:#142440;color:#a9ccff}.workspace{position:relative;overflow:hidden;background:radial-gradient(circle at 35% 20%,rgba(44,83,132,.10),transparent 32%),linear-gradient(#12203355 1px,transparent 1px),linear-gradient(90deg,#12203355 1px,transparent 1px);background-size:auto,32px 32px,32px 32px}.window{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);min-width:220px;min-height:150px;touch-action:none}.window.focused{border-color:#416792}.window.full{inset:8px!important;width:auto!important;height:auto!important;z-index:9998!important}.window.min{height:42px!important;min-height:42px!important}.window.min .content,.window.min .resizer{display:none}.window.locked .resizer{display:none}.whead{height:42px;display:flex;align-items:center;padding:0 9px;border-bottom:1px solid var(--line);background:#0e1928;direction:ltr;user-select:none;touch-action:none}.wtitle{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wmeta{font-size:10px;color:var(--muted);margin-left:7px}.wtools{margin-left:auto;display:flex;gap:2px}.icon{width:28px;height:28px;border:0;background:transparent;color:var(--muted);border-radius:7px}.icon:hover{background:#16263a;color:#dbe9ff}.content{height:calc(100% - 42px);overflow:auto;touch-action:auto}.resizer{position:absolute;right:0;bottom:0;width:34px;height:34px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,#4b6588 56% 61%,transparent 62% 69%,#4b6588 70% 75%,transparent 76%)}
.watch{height:100%;padding:8px;direction:ltr}.watchhead{display:flex;gap:6px;margin-bottom:7px}.watchhead input{width:100%;background:#0b1522;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px}.watchrow{display:grid;grid-template-columns:1fr auto;gap:5px;padding:8px;border-radius:8px;border-bottom:1px solid #1a293d;cursor:pointer}.watchrow:hover,.watchrow.active{background:#14243a}.sym{font-weight:800}.company{font-size:10px;color:var(--muted)}.price{text-align:right;font-weight:700}.pct{font-size:11px;text-align:right}.marketTabs{height:100%;display:grid;grid-template-rows:36px 1fr}.tabs{display:flex;gap:4px;padding:5px 7px;border-bottom:1px solid var(--line);direction:ltr;background:#0c1624}.tab{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:5px 9px;font-size:11px}.tab.active{background:#17345f;color:#b7d7ff}.marketPane{min-height:0;height:100%}.tv{height:100%;min-height:200px}.iframe{width:100%;height:100%;border:0;background:white}.notes{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px;padding:9px}.notes input,.notes textarea,.chat input,.ytcontrols input{background:#0b1522;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px}.notes textarea{resize:none;direction:rtl;min-height:100px}.feed{padding:8px;direction:ltr}.feed a,.feed .item{display:block;text-decoration:none;color:var(--text);border-bottom:1px solid #1b2b40;padding:9px 4px}.feed a:hover{background:#132238}.source{font-size:10px;color:var(--muted);margin-top:3px}.chat{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:9px;direction:ltr}.context{border:1px solid var(--line);background:#0d1725;border-radius:9px;padding:10px}.ctx{color:#9fc8ff;font-size:12px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}.quick button{background:#111e2e;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;text-align:left}.drop{display:grid;place-items:center;text-align:center;border:1px dashed #395578;border-radius:10px;color:var(--muted);min-height:120px;padding:15px}.chatbar{display:flex;gap:6px}.chatbar input{flex:1;min-width:0}.ytbox{height:100%;display:grid;grid-template-rows:auto 1fr;gap:6px;padding:8px}.ytcontrols{display:flex;gap:6px;direction:ltr}.ytcontrols input{flex:1;min-width:0}.ytframe{width:100%;height:100%;min-height:120px;border:0;border-radius:8px;background:black}.calendar{height:100%;padding:8px;direction:ltr}.event{display:grid;grid-template-columns:58px 1fr auto;gap:7px;padding:8px 2px;border-bottom:1px solid #1b2b40}.impact{font-size:10px}.dockhint{position:absolute;inset:0;pointer-events:none;display:none;z-index:9000}.dockhint.show{display:block}.zone{position:absolute;background:rgba(59,130,246,.12);border:1px dashed #5796f5}.zone.left{left:8px;top:8px;bottom:8px;width:25%}.zone.right{right:8px;top:8px;bottom:8px;width:25%}.zone.top{left:27%;right:27%;top:8px;height:25%}.zone.bottom{left:27%;right:27%;bottom:8px;height:25%}
.captureLayer{position:fixed;inset:84px 0 34px 58px;background:rgba(5,10,18,.18);z-index:12000;display:none;cursor:crosshair;touch-action:none}.captureLayer.show{display:block}.selection{position:absolute;border:2px solid #4b93ff;background:rgba(59,130,246,.13)}.capbar{position:fixed;z-index:12500;display:none;gap:5px;padding:6px;border-radius:10px;background:#0d1725;border:1px solid var(--line2);box-shadow:var(--shadow);direction:ltr}.capbar.show{display:flex}.capbar button{border:1px solid var(--line);background:#132238;color:var(--text);border-radius:7px;padding:7px 8px}.footer{display:flex;align-items:center;gap:16px;padding:0 10px;border-top:1px solid var(--line);background:#0a1320;font-size:11px;direction:ltr}.saveState{margin-left:auto;color:var(--green)}.presetMenu{position:fixed;right:120px;top:52px;background:#0e1928;border:1px solid var(--line);border-radius:10px;padding:6px;z-index:15000;display:none;min-width:180px;box-shadow:var(--shadow);direction:ltr}.presetMenu.show{display:block}.presetMenu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:9px;border-radius:7px}.presetMenu button:hover{background:#15263b}.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#101b2b;border:1px solid var(--line2);color:white;border-radius:9px;padding:9px 12px;opacity:0;pointer-events:none;z-index:16000;transition:.2s}.toast.show{opacity:1}
@media(max-width:900px){.marketstrip{left:0}.body{grid-template-columns:1fr}.rail{display:none}.captureLayer{left:0}.toolbar .btn:nth-child(2),.toolbar .btn:nth-child(3){display:none}.brand span:not(.badge){display:none}.window{min-width:180px}.footer{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><span class="logo">MW</span><span>Market Workspace</span><span class="badge">V6 HYBRID</span></div><input class="search" id="globalSearch" placeholder="Search ticker, company, news, note..."><div class="toolbar"><button class="btn" id="layoutBtn">Layouts ▾</button><button class="btn" id="freeBtn">Free Mode</button><button class="btn" id="saveBtn">Save</button><button class="btn primary" id="captureBtn">Capture</button></div></header>
<div class="marketstrip"><span><b>S&P 500</b> 5,625.80 <span class="pos">+0.45%</span></span><span><b>NASDAQ</b> 17,668.40 <span class="pos">+0.63%</span></span><span><b>DOW</b> 41,240.52 <span class="pos">+0.20%</span></span><span><b>VIX</b> 15.62 <span class="neg">-2.38%</span></span></div>
<div class="body">
<nav class="rail"><button class="active">Home</button><button>Markets</button><button>News</button><button>Calendar</button><button>Notes</button><button>AI</button><button>More</button></nav>
<main class="workspace" id="workspace"><div class="dockhint" id="dockhint"><div class="zone left"></div><div class="zone right"></div><div class="zone top"></div><div class="zone bottom"></div></div></main>
</div>
<footer class="footer"><span>NOTES</span><span>CAPTURE TRAY</span><span>RECENT ITEMS</span><span class="saveState" id="saveState">● Saved locally</span></footer>
</div>
<div class="presetMenu" id="presetMenu"><button data-preset="research">Research Desk</button><button data-preset="trading">Trading Focus</button><button data-preset="video">Market + Video</button><button data-preset="macro">Macro Desk</button><button data-preset="default">Reset Default</button></div>
<div class="captureLayer" id="captureLayer"><div class="selection" id="selection"></div></div><div class="capbar" id="capbar"><button data-cap="ai">Send to ChatGPT</button><button data-cap="note">Save to Notebook</button><button data-cap="pin">Pin Clip</button><button data-cap="cancel">Cancel</button></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),ws=$('#workspace');
const stocks=[['NASDAQ:AMZN','AMZN','Amazon.com','261.06','-0.39%'],['NASDAQ:NVDA','NVDA','NVIDIA','126.63','+1.68%'],['NASDAQ:AAPL','AAPL','Apple','223.19','+0.19%'],['NASDAQ:MSFT','MSFT','Microsoft','416.80','+0.38%'],['NASDAQ:GOOGL','GOOGL','Alphabet','165.98','+0.75%'],['NASDAQ:META','META','Meta','517.91','+0.16%'],['NASDAQ:TSLA','TSLA','Tesla','214.16','-0.86%']];
const S={ticker:'NASDAQ:AMZN',free:true,clips:0,notes:'',video:'dQw4w9WgXcQ',windows:[]};let z=10;
const defs=[
{id:'watch',title:'Watchlist',x:10,y:10,w:245,h:310,type:'watch'},
{id:'market',title:'Market / Browser',x:265,y:10,w:650,h:505,type:'market'},
{id:'chat',title:'ChatGPT Research',x:925,y:10,w:360,h:505,type:'chat'},
{id:'cal',title:'Economic Calendar',x:10,y:330,w:245,h:300,type:'calendar'},
{id:'news',title:'Financial News',x:265,y:525,w:320,h:210,type:'news'},
{id:'youtube',title:'YouTube',x:595,y:525,w:320,h:210,type:'youtube'},
{id:'notes',title:'Notebook',x:925,y:525,w:360,h:210,type:'notes'}];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
function short(){return S.ticker.split(':').pop()}
function save(){localStorage.setItem('mw-v6-hybrid',JSON.stringify({ticker:S.ticker,free:S.free,clips:S.clips,notes:S.notes,video:S.video,windows:S.windows}));$('#saveState').textContent='● Saved locally';toast('Layout saved')}
function load(){try{const x=JSON.parse(localStorage.getItem('mw-v6-hybrid'));if(x)Object.assign(S,x)}catch{}if(!S.windows?.length)S.windows=JSON.parse(JSON.stringify(defs))}
function windowBody(w){if(w.type==='watch')return `<div class="watch"><div class="watchhead"><input id="watchFilter" placeholder="Filter watchlist"></div><div id="watchRows"></div></div>`;if(w.type==='market')return `<div class="marketTabs"><div class="tabs"><button class="tab active" data-market="tv">TradingView</button><button class="tab" data-market="yahoo">Yahoo</button><button class="tab" data-market="google">Google Finance</button><button class="tab" data-market="sec">SEC / IR</button></div><div class="marketPane" id="marketPane"><div id="tv_market" class="tv"></div></div></div>`;if(w.type==='chat')return `<div class="chat"><div class="context"><b>Market AI Assistant</b><div class="ctx">Context: <span id="ctxTicker">${short()}</span> · selected workspace items</div></div><div class="quick"><button>Analyze ${short()}</button><button>Explain News</button><button>Market Summary</button><button>Compare Peers</button></div><div class="drop" id="aiDrop">Capture, drag a clip, or select a window<br>to add it as AI context</div><div class="chatbar"><input placeholder="Ask about ${short()} or this workspace..."><button class="btn primary">Send</button></div></div>`;if(w.type==='notes')return `<div class="notes"><input value="Research Notes — ${short()}" id="noteTitle"><textarea id="noteText" placeholder="یادداشت بنویسید...">${S.notes||''}</textarea></div>`;if(w.type==='calendar')return `<div class="calendar"><div class="event"><span>08:00</span><div>GDP (QoQ) Q2<div class="source">Germany</div></div><span class="impact neg">HIGH</span></div><div class="event"><span>14:30</span><div>Core PCE Price Index<div class="source">United States</div></div><span class="impact neg">HIGH</span></div><div class="event"><span>16:30</span><div>EIA Crude Oil Inventories<div class="source">United States</div></div><span class="impact pos">MED</span></div></div>`;if(w.type==='news')return `<div class="feed"><a target="_blank" href="https://finance.yahoo.com/quote/${short()}/news/">Yahoo Finance — ${short()} News<div class="source">Company / market news</div></a><a target="_blank" href="https://www.reuters.com/site-search/?query=${short()}">Reuters search — ${short()}<div class="source">External source</div></a><a target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(short()+' stock news')}&tbm=nws">Google News — ${short()}<div class="source">Aggregated headlines</div></a></div>`;return `<div class="ytbox"><div class="ytcontrols"><input id="ytInput" placeholder="Paste YouTube URL"><button class="btn" id="ytLoad">Load</button></div><iframe class="ytframe" src="https://www.youtube-nocookie.com/embed/${S.video}?playsinline=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`}
function render(){ws.querySelectorAll('.window').forEach(x=>x.remove());S.windows.forEach((w,i)=>{const e=document.createElement('section');e.className='window'+(w.full?' full':'')+(w.min?' min':'')+(w.lock?' locked':'');if(w.hidden)e.style.display='none';e.dataset.id=w.id;e.style.left=w.x+'px';e.style.top=w.y+'px';e.style.width=w.w+'px';e.style.height=w.h+'px';e.style.zIndex=w.z||i+1;e.innerHTML=`<div class="whead"><span class="wtitle">${w.title}</span><span class="wmeta">${w.type==='market'?short():''}</span><div class="wtools"><button class="icon" data-a="dock">▦</button><button class="icon" data-a="lock">${w.lock?'🔒':'🔓'}</button><button class="icon" data-a="min">—</button><button class="icon" data-a="full">⛶</button><button class="icon" data-a="hide">×</button></div></div><div class="content">${windowBody(w)}</div><div class="resizer"></div>`;ws.appendChild(e);bindWindow(e,w)});bindContent();setTimeout(mountTV,0)}
function focus(e,w){document.querySelectorAll('.window').forEach(x=>x.classList.remove('focused'));e.classList.add('focused');w.z=++z;e.style.zIndex=w.z}
function bindWindow(e,w){const h=e.querySelector('.whead'),r=e.querySelector('.resizer');let drag=null;h.onpointerdown=ev=>{focus(e,w);if(!S.free||w.lock||w.full||ev.target.closest('button'))return;h.setPointerCapture(ev.pointerId);drag={x:ev.clientX,y:ev.clientY,ox:w.x,oy:w.y};$('#dockhint').classList.add('show')};h.onpointermove=ev=>{if(!drag)return;w.x=Math.max(0,Math.min(ws.clientWidth-w.w,drag.ox+ev.clientX-drag.x));w.y=Math.max(0,Math.min(ws.clientHeight-42,drag.oy+ev.clientY-drag.y));e.style.left=w.x+'px';e.style.top=w.y+'px'};h.onpointerup=ev=>{if(!drag)return;drag=null;$('#dockhint').classList.remove('show');autoSnap(w,ev);render()};r.onpointerdown=ev=>{focus(e,w);if(!S.free||w.lock||w.full)return;r.setPointerCapture(ev.pointerId);drag={x:ev.clientX,y:ev.clientY,ow:w.w,oh:w.h,resize:1}};r.onpointermove=ev=>{if(!drag?.resize)return;w.w=Math.max(220,Math.min(ws.clientWidth-w.x,drag.ow+ev.clientX-drag.x));w.h=Math.max(150,Math.min(ws.clientHeight-w.y,drag.oh+ev.clientY-drag.y));e.style.width=w.w+'px';e.style.height=w.h+'px'};r.onpointerup=()=>{drag=null;save()};e.onclick=()=>focus(e,w);e.querySelectorAll('[data-a]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const a=b.dataset.a;if(a==='lock')w.lock=!w.lock;if(a==='min')w.min=!w.min;if(a==='full')w.full=!w.full;if(a==='hide')w.hidden=true;if(a==='dock')dockCycle(w);render();save()})}
function autoSnap(w,ev){const rect=ws.getBoundingClientRect(),x=ev.clientX-rect.left,y=ev.clientY-rect.top,W=ws.clientWidth,H=ws.clientHeight,m=50;if(x<m){Object.assign(w,{x:8,y:8,w:Math.round(W*.33)-12,h:H-16})}else if(x>W-m){Object.assign(w,{x:Math.round(W*.67)+4,y:8,w:Math.round(W*.33)-12,h:H-16})}else if(y<m){Object.assign(w,{x:Math.round(W*.2),y:8,w:Math.round(W*.6),h:Math.round(H*.48)})}else if(y>H-m){Object.assign(w,{x:Math.round(W*.2),y:Math.round(H*.52),w:Math.round(W*.6),h:Math.round(H*.48)-8})}save()}
function dockCycle(w){const W=ws.clientWidth,H=ws.clientHeight;w.dock=(w.dock||0)+1;if(w.dock>4)w.dock=1;if(w.dock===1)Object.assign(w,{x:8,y:8,w:Math.round(W*.32),h:H-16});if(w.dock===2)Object.assign(w,{x:Math.round(W*.68),y:8,w:Math.round(W*.32)-8,h:H-16});if(w.dock===3)Object.assign(w,{x:Math.round(W*.18),y:8,w:Math.round(W*.64),h:Math.round(H*.48)});if(w.dock===4)Object.assign(w,{x:Math.round(W*.18),y:Math.round(H*.52),w:Math.round(W*.64),h:Math.round(H*.48)-8})}
function bindContent(){document.querySelectorAll('.watchrow').forEach(x=>x.onclick=()=>selectTicker(x.dataset.t));const rows=$('#watchRows');if(rows){rows.innerHTML=stocks.map((s,i)=>`<div class="watchrow ${s[0]===S.ticker?'active':''}" data-t="${s[0]}"><div><div class="sym">${s[1]}</div><div class="company">${s[2]}</div></div><div><div class="price">${s[3]}</div><div class="pct ${s[4].startsWith('+')?'pos':'neg'}">${s[4]}</div></div></div>`).join('');rows.querySelectorAll('.watchrow').forEach(x=>x.onclick=()=>selectTicker(x.dataset.t));const f=$('#watchFilter');f.oninput=()=>{const q=f.value.toLowerCase();rows.querySelectorAll('.watchrow').forEach((e,i)=>e.style.display=stocks[i][1].toLowerCase().includes(q)||stocks[i][2].toLowerCase().includes(q)?'grid':'none')}}document.querySelectorAll('[data-market]').forEach(b=>b.onclick=()=>switchMarket(b.dataset.market,b));const nt=$('#noteText');if(nt)nt.oninput=()=>{S.notes=nt.value;$('#saveState').textContent='● Unsaved changes'};const yl=$('#ytLoad');if(yl)yl.onclick=()=>{const raw=$('#ytInput').value.trim();const m=raw.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)?([A-Za-z0-9_-]{11})/);if(!m)return toast('Invalid YouTube link');S.video=m[1];render();save()}}
function selectTicker(t){S.ticker=t;render();save()}
function switchMarket(mode,btn){document.querySelectorAll('[data-market]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const p=$('#marketPane');if(mode==='tv'){p.innerHTML='<div id="tv_market" class="tv"></div>';mountTV()}if(mode==='yahoo')p.innerHTML=`<iframe class="iframe" src="https://finance.yahoo.com/quote/${short()}/"></iframe>`;if(mode==='google')p.innerHTML=`<iframe class="iframe" src="https://www.google.com/finance/quote/${short()}:NASDAQ"></iframe>`;if(mode==='sec')p.innerHTML=`<div class="feed"><a target="_blank" href="https://www.sec.gov/edgar/search/#/q=${short()}">Open SEC EDGAR search for ${short()}</a><a target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(short()+' investor relations')}">Open company Investor Relations search</a></div>`}
function mountTV(){const c=$('#tv_market');if(!c)return;c.innerHTML='';const s=document.createElement('script');s.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';s.async=true;s.innerHTML=JSON.stringify({autosize:true,symbol:S.ticker,interval:'D',timezone:'Europe/Berlin',theme:'dark',style:'1',locale:'en',allow_symbol_change:true,calendar:false,support_host:'https://www.tradingview.com'});c.appendChild(s)}
function preset(name){const W=ws.clientWidth,H=ws.clientHeight,g=8,map=Object.fromEntries(S.windows.map(x=>[x.id,x]));S.windows.forEach(w=>{w.hidden=false;w.full=false;w.min=false});if(name==='research'||name==='default'){Object.assign(map.watch,{x:g,y:g,w:230,h:290});Object.assign(map.market,{x:246,y:g,w:Math.round(W*.52),h:Math.round(H*.64)});Object.assign(map.chat,{x:258+Math.round(W*.52),y:g,w:W-(266+Math.round(W*.52)),h:Math.round(H*.64)});Object.assign(map.cal,{x:g,y:306,w:230,h:H-314});Object.assign(map.news,{x:246,y:Math.round(H*.64)+16,w:Math.round(W*.25),h:H-(Math.round(H*.64)+24)});Object.assign(map.youtube,{x:254+Math.round(W*.25),y:Math.round(H*.64)+16,w:Math.round(W*.27),h:H-(Math.round(H*.64)+24)});Object.assign(map.notes,{x:262+Math.round(W*.52),y:Math.round(H*.64)+16,w:W-(270+Math.round(W*.52)),h:H-(Math.round(H*.64)+24)})}if(name==='trading'){Object.assign(map.watch,{x:g,y:g,w:240,h:H-16});Object.assign(map.market,{x:256,y:g,w:W-600,h:H-16});Object.assign(map.chat,{x:W-336,y:g,w:328,h:H-16});['cal','news','youtube','notes'].forEach(k=>map[k].hidden=true)}if(name==='video'){Object.assign(map.market,{x:g,y:g,w:Math.round(W*.62),h:H-16});Object.assign(map.youtube,{x:Math.round(W*.62)+16,y:g,w:W-(Math.round(W*.62)+24),h:Math.round(H*.56)});Object.assign(map.chat,{x:Math.round(W*.62)+16,y:Math.round(H*.56)+16,w:W-(Math.round(W*.62)+24),h:H-(Math.round(H*.56)+24)});['watch','cal','news','notes'].forEach(k=>map[k].hidden=true)}if(name==='macro'){Object.assign(map.cal,{x:g,y:g,w:Math.round(W*.35),h:H-16});Object.assign(map.news,{x:Math.round(W*.35)+16,y:g,w:Math.round(W*.32),h:H-16});Object.assign(map.chat,{x:Math.round(W*.67)+24,y:g,w:W-(Math.round(W*.67)+32),h:H-16});['watch','market','youtube','notes'].forEach(k=>map[k].hidden=true)}render();save()}
$('#layoutBtn').onclick=()=>$('#presetMenu').classList.toggle('show');$('#presetMenu').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#presetMenu').classList.remove('show');preset(b.dataset.preset)});$('#freeBtn').onclick=()=>{S.free=!S.free;$('#freeBtn').classList.toggle('active',S.free);$('#freeBtn').textContent=S.free?'Free Mode':'Locked Grid';toast(S.free?'Free move + resize enabled':'Layout locked')};$('#freeBtn').classList.toggle('active',S.free);$('#saveBtn').onclick=save;
let start=null,rect=null;const layer=$('#captureLayer'),sel=$('#selection'),bar=$('#capbar');$('#captureBtn').onclick=()=>{layer.classList.add('show');sel.style.display='none';bar.classList.remove('show');toast('Draw a rectangle with pen, touch or mouse')};layer.onpointerdown=e=>{layer.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY};sel.style.display='block'};layer.onpointermove=e=>{if(!start)return;const x=Math.min(start.x,e.clientX)-58,y=Math.min(start.y,e.clientY)-84,w=Math.abs(e.clientX-start.x),h=Math.abs(e.clientY-start.y);rect={x,y,w,h};sel.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`};layer.onpointerup=e=>{if(!rect||rect.w<20||rect.h<20){layer.classList.remove('show');return}start=null;bar.style.left=Math.min(innerWidth-420,e.clientX)+'px';bar.style.top=Math.min(innerHeight-80,e.clientY+8)+'px';bar.classList.add('show')};bar.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{const a=b.dataset.cap;if(a==='ai'){S.clips++;const d=$('#aiDrop');if(d)d.innerHTML=`<b>${S.clips} capture(s) attached</b><br>Ready for analysis with ${short()} context`;toast('Capture attached to ChatGPT context')}if(a==='note'){S.notes+=(S.notes?'\n':'')+`[Capture ${Math.round(rect.w)}×${Math.round(rect.h)} · ${short()} · ${new Date().toLocaleTimeString()}]`;toast('Capture reference saved to Notebook')}if(a==='pin'){S.clips++;toast('Clip pinned to Capture Tray')}layer.classList.remove('show');bar.classList.remove('show');rect=null;save()});$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){const q=e.target.value.trim().toUpperCase();const hit=stocks.find(s=>s[1]===q||s[2].toUpperCase().includes(q));if(hit)selectTicker(hit[0]);else toast('Search currently filters known watchlist symbols')}};
load();render();setTimeout(()=>preset('research'),60);
