egative{color:var(--red)}.warning{color:var(--amber)}.span8{grid-column:span 8}.span4{grid-column:span 4}.span6{grid-column:span 6}.span12{grid-column:span 12}.chart{height:240px;display:flex;align-items:flex-end;gap:4px;padding:10px 0}.bar{flex:1;background:linear-gradient(180deg,var(--blue),rgba(79,140,255,.25));border-radius:3px 3px 0 0;min-width:3px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-weight:600}.watchRow{cursor:pointer}.watchRow.active{background:rgba(79,140,255,.09)}.provider{height:100%;min-height:420px;display:grid;grid-template-rows:auto 1fr;gap:10px}.providerBar{display:flex;gap:8px;align-items:center}.providerFrame{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);display:grid;place-items:center;min-height:360px;overflow:hidden}.fallback{text-align:center;max-width:620px;padding:24px}.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 11px;border-radius:8px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.newsList{display:grid;gap:8px}.newsItem{padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px}.newsMeta{font-size:11px;color:var(--muted);margin-bottom:5px}.noteArea{width:100%;min-height:320px;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;outline:none}.aiBox{display:grid;grid-template-rows:1fr auto;height:100%;min-height:420px;gap:10px}.aiStream{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;overflow:auto}.aiInput{display:flex;gap:8px}.aiInput input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}.ytWrap{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px}.ytControls{display:flex;gap:8px}.ytControls input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}.ytFrame{width:100%;height:100%;min-height:420px;border:0;border-radius:10px;background:#000}.split{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 7px minmax(0,1fr)}.pane{min-width:0;overflow:auto}.divider{background:var(--line);cursor:col-resize}.splitPicker{display:flex;gap:8px;flex-wrap:wrap}.captureOverlay{position:fixed;inset:0;display:none;z-index:100;background:rgba(2,6,23,.08);cursor:crosshair;touch-action:none}.captureOverlay.show{display:block}.selection{position:absolute;border:2px solid var(--blue);background:rgba(79,140,255,.16)}.captureMenu{position:absolute;display:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px;box-shadow:0 15px 40px rgba(0,0,0,.35);gap:4px;flex-wrap:wrap;max-width:430px}.captureMenu.show{display:flex}.captureMenu button{border:0;background:var(--panel2);padding:7px 9px;border-radius:7px}.palette{position:fixed;inset:0;background:rgba(2,6,23,.52);z-index:120;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}.palette.show{display:flex}.paletteBox{width:min(620px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 22px 60px rgba(0,0,0,.4);overflow:hidden}.paletteBox input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px;outline:none}.cmdList{max-height:340px;overflow:auto}.cmd{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}.cmd:hover{background:var(--panel2)}.drawerShade{display:none}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(12px);opacity:0;background:#111827;color:#fff;border-radius:8px;padding:9px 12px;z-index:200;transition:.2s;pointer-events:none;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<div class="app" id="app"><aside class="sidebar"><div class="brand"><div class="brandMark">MW</div><div class="brandText">Market Workspace <span class="small">V7</span></div></div><nav class="nav" id="nav"></nav><div class="sideFoot"><button class="sideToggle" id="sideToggle">⇤ <span class="navLabel">Collapse sidebar</span></button></div></aside><div class="drawerShade" id="drawerShade"></div><section class="shell"><header class="topbar"><button class="topBtn hamb" id="hamb">☰</button><div class="search"><input id="globalSearch" placeholder="Search ticker or command…"><span class="kbd">⌘/Ctrl K</span></div><div class="chip tickerChip" id="tickerChip">AMZN</div><div class="chip marketChip"><span class="statusDot"></span><span>Market <b>Demo</b></span></div><div class="chip workspaceChip" id="workspaceChip">Home</div><button class="topBtn" id="splitBtn">◫ <span>Split</span></button><button class="topBtn primary" id="captureBtn">⌗ <span>Capture</span></button><div class="chip syncChip">● Local</div></header><main class="workspace" id="workspace"></main></section></div>
<div class="captureOverlay" id="captureOverlay"><div class="selection" id="selection"></div><div class="captureMenu" id="captureMenu"></div></div><div class="palette" id="palette"><div class="paletteBox"><input id="cmdInput" placeholder="Type command, ticker, or action…"><div class="cmdList" id="cmdList"></div></div></div><div class="toast" id="toast"></div>
<script>
const NAV=[['home','⌂','Home'],['market','▥','Market'],['news','◫','News'],['calendar','◷','Economic Calendar'],['watchlist','★','Watchlist'],['notebook','✎','Notebook'],['ai','✦','ChatGPT / AI'],['youtube','▶','YouTube'],['capture','⌗','Capture'],['research','⌕','Research / Filings'],['settings','⚙','Settings']];
const TABS={market:['Overview','Yahoo Finance','TradingView','Google Finance','SEC','Investor Relations'],news:['My Watchlist','Company News','Macro','Fed','Earnings','Geopolitics','Important People / X'],notebook:['Notes','Files','Captures','Cases','Timeline','Knowledge Graph'],ai:['Chat','Analyze Active Ticker','Explain Chart','Compare Companies','Analyze Earnings','Summarize News','Research Current Context'],research:['SEC','Investor Relations','Filings Queue'],calendar:['Week','Fed','Earnings','Macro'],watchlist:['Primary','Semiconductors','Energy'],youtube:['Player','Recent'],capture:['Recent Captures'],settings:['General','Appearance','Data & Privacy'],home:['Overview']};
const prices={AMZN:[218.42,1.37],NVDA:[184.16,2.11],MSFT:[527.30,-.42],AAPL:[229.12,.68],GOOGL:[211.88,1.02],META:[694.30,-.71],INTC:[25.41,3.18],TSLA:[349.55,-1.64]};
const defaults={context:{activeTicker:'AMZN',activeCompany:'Amazon.com, Inc.',activeSection:'home',activeSource:'Demo',activeDateRange:'1M',activeCapture:null,activeNote:null},tabs:{},watchlists:{Primary:['AMZN','NVDA','MSFT','AAPL','GOOGL'],Semiconductors:['NVDA','INTC'],Energy:['XOM','CVX']},notes:'',captures:[],recent:['AMZN','NVDA'],split:false,splitSecondary:'ai',sidebarCollapsed:false,theme:'dark',youtubeId:'dQw4w9WgXcQ',preset:'Research Desk'};
let S=load();function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return deepMerge(clone(defaults),JSON.parse(localStorage.getItem('market-v7')||'{}'))}catch{return clone(defaults)}}function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))deepMerge(a[k],b[k]);else a[k]=b[k]}return a}function save(){localStorage.setItem('market-v7',JSON.stringify(S))}const $=s=>document.querySelector(s),app=$('#app'),workspace=$('#workspace');function toast(x){const t=$('#toast');t.textContent=x;t.classList.add('show');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('show'),1400)}function sym(x){return x.toUpperCase().replace(/[^A-Z.]/g,'').slice(0,8)}function setTicker(t){t=sym(t);if(!t)return;S.context.activeTicker=t;S.context.activeCompany=({AMZN:'Amazon.com, Inc.',NVDA:'NVIDIA Corporation',MSFT:'Microsoft Corporation',AAPL:'Apple Inc.',GOOGL:'Alphabet Inc.',META:'Meta Platforms, Inc.',INTC:'Intel Corporation',TSLA:'Tesla, Inc.'}[t]||t);S.recent=[t,...S.recent.filter(x=>x!==t)].slice(0,8);save();render();toast('Context → '+t)}function navigate(id){S.context.activeSection=id;save();render();app.classList.remove('drawer')}function activeTab(section){return S.tabs[section]||TABS[section]?.[0]||'Overview'}function setTab(section,tab){S.tabs[section]=tab;save();renderWorkspace()}
function renderNav(){const nav=$('#nav');nav.innerHTML=NAV.map(([id,ic,label])=>`<button class="navBtn ${S.context.activeSection===id?'active':''}" data-nav="${id}" title="${label}"><span class="navIcon">${ic}</span><span class="navLabel">${label}</span></button>`).join('');nav.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));app.classList.toggle('collapsed',S.sidebarCollapsed)}function sectionHead(section,title){const tabs=TABS[section]||[];return `<div class="viewHead"><div class="viewTitle">${title}</div><div class="tabs">${tabs.map(t=>`<button class="tab ${activeTab(section)===t?'active':''}" data-tab="${esc(t)}">${t}</button>`).join('')}</div></div>`}function mockChart(){let h='';for(let i=0;i<58;i++){const v=20+Math.round((Math.sin(i/6)+1)*25)+Math.round(Math.random()*25);h+=`<div class="bar" style="height:${v}%" title="Demo series"></div>`}return h}function watchTable(group='Primary'){const list=S.watchlists[group]||[];return `<table class="table"><thead><tr><th>Ticker</th><th>Price</th><th>Change</th><th>Feed</th></tr></thead><tbody>${list.map(t=>{const p=prices[t]||[100+Math.random()*50,(Math.random()-.5)*3];return `<tr class="watchRow ${t===S.context.activeTicker?'active':''}" data-ticker="${t}"><td><b>${t}</b></td><td>${p[0].toFixed(2)}</td><td class="${p[1]>=0?'positive':'negative'}">${p[1]>=0?'+':''}${p[1].toFixed(2)}%</td><td class="small">DEMO</td></tr>`}).join('')}</tbody></table>`}
function overview(){const [p,c]=prices[S.context.activeTicker]||[127.42,.52];return `<div class="grid"><div class="card span8"><h3>${S.context.activeTicker} · DEMO PRICE SERIES</h3><div style="display:flex;align-items:end;gap:12px"><div class="metric">$${p.toFixed(2)}</div><div class="${c>=0?'positive':'negative'}">${c>=0?'+':''}${c.toFixed(2)}%</div></div><div class="chart">${mockChart()}</div><div class="small">Prototype data only — not investment-grade or real-time.</div></div><div class="card span4"><h3>GLOBAL CONTEXT</h3><table class="table"><tr><td>Ticker</td><td><b>${S.context.activeTicker}</b></td></tr><tr><td>Company</td><td>${S.context.activeCompany}</td></tr><tr><td>Range</td><td>${S.context.activeDateRange}</td></tr><tr><td>Source</td><td>DEMO</td></tr></table></div><div class="card span6"><h3>WATCHLIST</h3>${watchTable('Primary')}</div><div class="card span6"><h3>RESEARCH QUEUE</h3><div class="newsList"><div class="newsItem"><div class="newsMeta">SEC · DEMO</div>Latest filing queue for ${S.context.activeTicker}</div><div class="newsItem"><div class="newsMeta">Earnings · DEMO</div>Next earnings context placeholder</div><div class="newsItem"><div class="newsMeta">AI</div>Analyze ${S.context.activeTicker} across active context</div></div></div></div>`}
const providers={'Yahoo Finance':{url:t=>`https://finance.yahoo.com/quote/${t}/`},'TradingView':{url:t=>`https://www.tradingview.com/chart/?symbol=${encodeURIComponent('NASDAQ:'+t)}`},'Google Finance':{url:t=>`https://www.google.com/finance/quote/${t}:NASDAQ`},'SEC':{url:t=>`https://www.sec.gov/edgar/search/#/q=${encodeURIComponent(t)}`},'Investor Relations':{url:t=>`https://www.google.com/search?q=${encodeURIComponent(t+' investor relations')}`}};function providerView(name){const p=providers[name],url=p.url(S.context.activeTicker);return `<div class="provider"><div class="providerBar"><span class="small">Provider adapter · ${name}</span><button class="btn primary" data-open="${url}">Open externally ↗</button></div><div class="providerFrame"><div class="fallback"><h2>${name}</h2><p>Direct embedding is intentionally not assumed. Many finance, exchange and filing sites block iframe embedding using CSP or X-Frame-Options.</p><p class="small">V7 adapter policy: embedded when allowed → custom integrated view when available → external-open fallback.</p><button class="btn primary" data-open="${url}">Open ${name}</button></div></div></div>`}function marketBody(){const tab=activeTab('market');return tab==='Overview'?overview():providerView(tab)}
function newsBody(){const tab=activeTab('news'),t=S.context.activeTicker,items={'My Watchlist':[`Watchlist signal digest for ${t}`,'Macro event affects selected names','Earnings calendar cross-check'],'Company News':[`${t}: company-specific news feed placeholder`,`${t}: filings and IR signal placeholder`],Macro:['US yields / inflation / labor dashboard placeholder','Global risk regime placeholder'],Fed:['FOMC communication stream placeholder','Fed speaker calendar placeholder'],Earnings:[`${t} earnings monitoring placeholder`,'Mega-cap earnings queue'],Geopolitics:['Geopolitical market-risk stream placeholder','Sanctions / energy / shipping context'],'Important People / X':['Curated important-person stream placeholder','X links should open externally when embedding is restricted']};return `<div class="newsList">${(items[tab]||[]).map((x,i)=>`<div class="newsItem"><div class="newsMeta">${i?'DEMO SOURCE':'CONTEXT: '+t}</div><b>${x}</b><div class="small">Prototype content — provider integration comes later.</div></div>`).join('')}</div>`}
function notebookBody(){const tab=activeTab('notebook');if(tab==='Notes')return `<div class="card"><h3>NOTE · automatically inherits ticker ${S.context.activeTicker}</h3><textarea class="noteArea" id="noteArea" placeholder="Write research notes…">${escText(S.notes)}</textarea><div style="margin-top:8px"><button class="btn" id="saveNote">Save locally</button></div></div>`;if(tab==='Captures')return `<div class="newsList">${S.captures.length?S.captures.slice().reverse().map(c=>`<div class="newsItem"><div class="newsMeta">${c.time} · ${c.ticker} · ${c.section}</div><b>Capture ${c.w}×${c.h}</b><div class="small">${c.note||'No note'} · metadata only in prototype</div></div>`).join(''):'<div class="card">No captures yet. Use Capture in the top bar.</div>'}</div>`;return `<div class="card"><h3>${tab.toUpperCase()}</h3><p>Module shell ready for the Notebook architecture. Context inheritance: <b>${S.context.activeTicker}</b>.</p><div class="small">This prototype preserves the intended tabs without replacing the dedicated Notebook application.</div></div>`}
function aiBody(){const tab=activeTab('ai');return `<div class="aiBox"><div class="aiStream"><div class="small">MOCK AI · current context</div><h2>${tab}</h2><p><b>Ticker:</b> ${S.context.activeTicker}</p><p><b>Workspace:</b> ${S.context.activeSection}</p><p>This is a local prototype action surface. No API key or paid AI service is connected in the frontend.</p><div id="aiReply"></div></div><div class="aiInput"><input id="aiInput" placeholder="Ask about ${S.context.activeTicker}…"><button class="btn primary" id="aiSend">Send</button></div></div>`}
function youtubeBody(){return `<div class="ytWrap"><div class="ytControls"><input id="ytInput" placeholder="Paste YouTube URL or video ID"><button class="btn" id="ytLoad">Load</button><button class="btn" id="ytPip">PiP note</button></div><iframe class="ytFrame" src="https://www.youtube-nocookie.com/embed/${S.youtubeId}?playsinline=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`}function calendarBody(){return `<div class="grid"><div class="card span8"><h3>ECONOMIC CALENDAR · DEMO</h3><table class="table"><thead><tr><th>Date</th><th>Event</th><th>Importance</th><th>Context</th></tr></thead><tbody><tr><td>Thu</td><td>US Macro Release</td><td class="warning">High</td><td>Macro</td></tr><tr><td>Fri</td><td>Fed speaker</td><td class="warning">High</td><td>Fed</td></tr><tr><td>Next</td><td>${S.context.activeTicker} earnings placeholder</td><td>Watch</td><td>${S.context.activeTicker}</td></tr></tbody></table></div><div class="card span4"><h3>DATA STATUS</h3><p>Calendar entries shown here are demo placeholders.</p><div class="small">Production version should connect to verified official/provider sources and show timestamps/delay labels.</div></div></div>`}
function watchlistBody(){const group=activeTab('watchlist');return `<div class="grid"><div class="card span8"><h3>${group} WATCHLIST</h3>${watchTable(group)}</div><div class="card span4"><h3>MANAGE</h3><div style="display:flex;gap:7px"><input id="addTicker" placeholder="Ticker" style="min-width:0;flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px"><button class="btn" id="addTickerBtn">Add</button></div><p class="small">Click a row to synchronize global context. Groups and multiple watchlists are persisted locally.</p></div></div>`}function researchBody(){return activeTab('research')==='SEC'?providerView('SEC'):activeTab('research')==='Investor Relations'?providerView('Investor Relations'):`<div class="card"><h3>FILINGS QUEUE</h3><p>${S.context.activeTicker} · no live filing API connected.</p></div>`}function captureBody(){return `<div class="grid"><div class="card span8"><h3>RECENT CAPTURES</h3>${S.captures.length?S.captures.slice().reverse().map(c=>`<div class="newsItem"><div class="newsMeta">${c.time}</div><b>${c.ticker}</b> · ${c.section} · ${c.w}×${c.h}px</div>`).join(''):'No captures yet.'}</div><div class="card span4"><h3>CAPTURE MODEL</h3><p>Mouse, touch and pen use Pointer Events.</p><div class="small">Stored metadata: timestamp, source, ticker, section, note, region geometry. Image rasterization is not enabled in this lightweight browser-only prototype.</div></div></div>`}
function settingsBody(){return `<div class="grid"><div class="card span6"><h3>APPEARANCE</h3><button class="btn" id="themeBtn">Switch to ${S.theme==='dark'?'Light':'Dark'} theme</button></div><div class="card span6"><h3>LOCAL-FIRST STATE</h3><p>Watchlists, ticker, tabs, notes, captures, split view and sidebar state are stored in this browser.</p><button class="btn" id="resetBtn">Reset V7 local data</button></div><div class="card span12"><h3>PRESET WORKSPACES</h3><div class="splitPicker">${['Research Desk','Trading Desk','Macro Desk','Earnings Desk','Video Desk'].map(x=>`<button class="btn preset" data-preset="${x}">${x}</button>`).join('')}</div></div></div>`}function homeBody(){return `<div class="grid"><div class="card span8"><h3>MARKET WORKSPACE SHELL</h3><div class="metric">${S.context.activeTicker}</div><p>${S.context.activeCompany}</p><div class="small">Browser-first · local-first · adapter-based · V7 prototype</div><div class="chart">${mockChart()}</div></div><div class="card span4"><h3>WORKSPACE PRESET</h3><div class="metric" style="font-size:18px">${S.preset}</div><p class="small">Current mode can define active section, tabs and split configuration.</p><button class="btn" id="applyPreset">Apply preset</button></div><div class="card span6"><h3>WATCHLIST</h3>${watchTable('Primary')}</div><div class="card span6"><h3>QUICK ACTIONS</h3><div class="splitPicker"><button class="btn" data-go="news">Open News</button><button class="btn" data-go="ai">Analyze ${S.context.activeTicker}</button><button class="btn" data-go="notebook">New Note</button><button class="btn" id="homeCapture">Capture</button></div></div></div>`}
function sectionBody(section){return ({home:homeBody,market:marketBody,news:newsBody,calendar:calendarBody,watchlist:watchlistBody,notebook:notebookBody,ai:aiBody,youtube:youtubeBody,capture:captureBody,research:researchBody,settings:settingsBody}[section]||homeBody)()}function titleFor(id){return NAV.find(x=>x[0]===id)?.[2]||id}function singleView(section){return `<section class="view" data-section="${section}">${sectionHead(section,titleFor(section))}<div class="content">${sectionBody(section)}</div></section>`}function renderWorkspace(){const sec=S.context.activeSection;if(S.split&&innerWidth>820){workspace.innerHTML=`<div class="split" id="split"><div class="pane">${singleView(sec)}</div><div class="divider" id="divider"></div><div class="pane secondary">${singleView(S.splitSecondary)}</div></div>`;bindDivider()}else{workspace.innerHTML=singleView(sec);bindContent();bindTabs()}}function bindTabs(){workspace.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const sec=b.closest('.view')?.dataset.section||S.context.activeSection;setTab(sec,b.dataset.tab)})}
function bindContent(){workspace.querySelectorAll('[data-ticker]').forEach(r=>r.onclick=()=>setTicker(r.dataset.ticker));workspace.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>window.open(b.dataset.open,'_blank','noopener'));workspace.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));const n=$('#noteArea');if(n)n.oninput=()=>{S.notes=n.value;save()};const sn=$('#saveNote');if(sn)sn.onclick=()=>toast('Note saved locally');const a=$('#aiSend');if(a)a.onclick=()=>{const v=$('#aiInput').value.trim();if(v)$('#aiReply').innerHTML=`<hr style="border-color:var(--line)"><b>Mock analysis request saved:</b><p>${escText(v)}</p><p class="small">Context: ${S.context.activeTicker}. Connect a secure backend later for real AI.</p>`};const y=$('#ytLoad');if(y)y.onclick=()=>{const raw=$('#ytInput').value.trim(),m=raw.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)?([A-Za-z0-9_-]{11})/);if(!m)return toast('Invalid YouTube URL / ID');S.youtubeId=m[1];save();renderWorkspace()};const pip=$('#ytPip');if(pip)pip.onclick=()=>toast('PiP depends on browser + YouTube iframe permissions');const at=$('#addTickerBtn');if(at)at.onclick=()=>{const t=sym($('#addTicker').value),g=activeTab('watchlist');if(t&&!S.watchlists[g].includes(t)){S.watchlists[g].push(t);save();renderWorkspace()}};const th=$('#themeBtn');if(th)th.onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();render()};const rs=$('#resetBtn');if(rs)rs.onclick=()=>{localStorage.removeItem('market-v7');location.reload()};workspace.querySelectorAll('.preset').forEach(b=>b.onclick=()=>applyPreset(b.dataset.preset));const ap=$('#applyPreset');if(ap)ap.onclick=()=>applyPreset(S.preset);const hc=$('#homeCapture');if(hc)hc.onclick=startCapture}
function bindDivider(){const d=$('#divider'),split=$('#split');if(!d)return;let drag=false;d.onpointerdown=e=>{drag=true;d.setPointerCapture(e.pointerId)};d.onpointermove=e=>{if(!drag)return;const r=split.getBoundingClientRect(),x=Math.max(280,Math.min(r.width-280,e.clientX-r.left));split.style.gridTemplateColumns=`${x}px 7px 1fr`};d.onpointerup=()=>drag=false;bindContent();bindTabs()}function render(){document.documentElement.classList.toggle('light',S.theme==='light');renderNav();$('#tickerChip').textContent=S.context.activeTicker;$('#workspaceChip').textContent=titleFor(S.context.activeSection);renderWorkspace()}function esc(s){return String(s).replace(/"/g,'&quot;')}function escText(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function applyPreset(name){S.preset=name;const map={'Research Desk':['market','ai'],'Trading Desk':['market','news'],'Macro Desk':['calendar','news'],'Earnings Desk':['news','ai'],'Video Desk':['youtube','notebook']},[a,b]=map[name]||['home','ai'];S.context.activeSection=a;S.split=true;S.splitSecondary=b;save();render();toast(name+' applied')}
function startCapture(){const o=$('#captureOverlay'),s=$('#selection'),m=$('#captureMenu');o.classList.add('show');s.style.cssText='display:none';m.classList.remove('show');let start=null,rect=null;function down(e){if(e.target.closest('.captureMenu'))return;start={x:e.clientX,y:e.clientY};s.style.display='block'}function move(e){if(!start)return;const x=Math.min(start.x,e.clientX),y=Math.min(start.y,e.clientY),w=Math.abs(e.clientX-start.x),h=Math.abs(e.clientY-start.y);rect={x,y,w,h};s.style.cssText=`display:block;left:${x}px;top:${y}px;width:${w}px;height:${h}px`}function up(){if(!rect||rect.w<12||rect.h<12){o.classList.remove('show');cleanup();return}m.innerHTML=['Send to ChatGPT','Save to Notebook','Pin','Copy','Download','Add ticker tag','Add source metadata','Cancel'].map(a=>`<button data-cap="${a}">${a}</button>`).join('');m.style.left=Math.min(rect.x,innerWidth-440)+'px';m.style.top=Math.min(rect.y+rect.h+8,innerHeight-90)+'px';m.classList.add('show');m.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>capAction(b.dataset.cap));start=null}function capAction(a){if(a==='Cancel'){o.classList.remove('show');cleanup();return}const c={time:new Date().toLocaleString(),source:location.href,ticker:S.context.activeTicker,section:S.context.activeSection,note:'',x:Math.round(rect.x),y:Math.round(rect.y),w:Math.round(rect.w),h:Math.round(rect.h)};S.context.activeCapture=c;if(['Save to Notebook','Send to ChatGPT','Pin'].includes(a))S.captures.push(c);if(a==='Save to Notebook')toast('Capture metadata saved to Notebook');else if(a==='Send to ChatGPT'){S.context.activeSection='ai';toast('Sent to mock AI context')}else if(a==='Copy')navigator.clipboard?.writeText(JSON.stringify(c)).then(()=>toast('Capture metadata copied')).catch(()=>toast('Clipboard unavailable'));else if(a==='Download'){const blob=new Blob([JSON.stringify(c,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download=`capture-${c.ticker}.json`;el.click();URL.revokeObjectURL(u)}else toast(a+' applied');save();o.classList.remove('show');cleanup();render()}function cleanup(){o.removeEventListener('pointerdown',down);o.removeEventListener('pointermove',move);o.removeEventListener('pointerup',up)}o.addEventListener('pointerdown',down);o.addEventListener('pointermove',move);o.addEventListener('pointerup',up)}
const commands=[['Open News',()=>navigate('news')],['New Note',()=>{navigate('notebook');setTab('notebook','Notes')}],['Analyze active ticker',()=>navigate('ai')],['Open Earnings',()=>{navigate('news');setTab('news','Earnings')}],['YouTube',()=>navigate('youtube')],['Open Market',()=>navigate('market')],['Capture',startCapture],['Research / Filings',()=>navigate('research')]];function openPalette(q=''){const p=$('#palette'),i=$('#cmdInput');p.classList.add('show');i.value=q;renderCommands(q);setTimeout(()=>i.focus(),0)}function renderCommands(q){q=q.trim();let arr=commands.filter(x=>x[0].toLowerCase().includes(q.toLowerCase()));if(/^[A-Za-z]{1,8}$/.test(q))arr=[[`Set active ticker: ${q.toUpperCase()}`,()=>setTicker(q)],...arr];$('#cmdList').innerHTML=arr.map((x,i)=>`<div class="cmd" data-c="${i}">${x[0]}</div>`).join('')||'<div class="cmd small">No matching command</div>';$('#cmdList').querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{arr[+el.dataset.c][1]();$('#palette').classList.remove('show')})}$('#cmdInput').oninput=e=>renderCommands(e.target.value);$('#palette').onclick=e=>{if(e.target.id==='palette')e.currentTarget.classList.remove('show')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape'){$('#palette').classList.remove('show');$('#captureOverlay').classList.remove('show')}});$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){const q=e.currentTarget.value.trim();if(/^[A-Za-z]{1,8}$/.test(q))setTicker(q);else openPalette(q)}};$('#sideToggle').onclick=()=>{S.sidebarCollapsed=!S.sidebarCollapsed;save();renderNav()};$('#hamb').onclick=()=>app.classList.add('drawer');$('#drawerShade').onclick=()=>app.classList.remove('drawer');$('#captureBtn').onclick=startCapture;$('#splitBtn').onclick=()=>{S.split=!S.split;save();renderWorkspace();toast(S.split?'Split view on':'Split view off')};window.addEventListener('beforeunload',save);window.addEventListener('resize',()=>renderWorkspace());if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
