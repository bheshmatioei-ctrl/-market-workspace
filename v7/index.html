<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles-v7.css">
<link rel="stylesheet" href="./media-live-v7.css">
<title>Market Workspace Shell — V7</title>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brandMark">MW</div><div class="brandText">Market Workspace <span class="small">V7</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sideFoot"><button class="sideToggle" id="sideToggle">⇤ <span class="navLabel">Collapse sidebar</span></button></div>
  </aside>
  <div class="drawerShade" id="drawerShade"></div>
  <section class="shell">
    <header class="topbar">
      <button class="topBtn hamb" id="hamb">☰</button>
      <div class="search"><input id="globalSearch" placeholder="Search ticker or command…"><span class="kbd">⌘/Ctrl K</span></div>
      <div class="chip tickerChip" id="tickerChip">AMZN</div>
      <div class="chip marketChip"><span class="statusDot"></span><span>Provider data <b>Live/Delayed</b></span></div>
      <div class="chip workspaceChip" id="workspaceChip">Home</div>
      <button class="topBtn" id="splitBtn">◫ <span>Split</span></button>
      <button class="topBtn" id="aiPanelBtn" aria-pressed="false">✦ <span>ChatGPT</span></button>
      <button class="topBtn primary" id="captureBtn">⌗ <span>Capture</span></button>
      <div class="chip syncChip">● Local state</div>
    </header>
    <main class="workspace" id="workspace"></main>
  </section>
</div>
<div class="captureOverlay" id="captureOverlay"><div class="selection" id="selection"></div><div class="captureMenu" id="captureMenu"></div></div>
<div class="palette" id="palette"><div class="paletteBox"><input id="cmdInput" placeholder="Type command, ticker, or action…"><div class="cmdList" id="cmdList"></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js" defer></script>
<script src="./app-v7.js" defer></script>
<script src="./media-live-v7.js" defer></script>
<script src="./qa-fixes-v7.js" defer></script>
<script src="./ai-sidepanel-v7.js" defer></script>
</body>
</html>
