<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market Research Workspace V5</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#1769e0"><style>:root{--bg:#eef3f8;--line:#d6dee9;--text:#0f172a;--muted:#64748b;--accent:#1769e0}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea{font:inherit}.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:8px 12px;direction:ltr}.brand{font-weight:800;margin-right:auto}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}#ws{position:relative;height:calc(100% - 60px);background:linear-gradient(#e5ebf3 1px,transparent 1px),linear-gradient(90deg,#e5ebf3 1px,transparent 1px);background-size:22px 22px;overflow:hidden;direction:ltr}.w{position:absolute;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 22px rgba(15,23,42,.13);overflow:hidden;min-width:180px;min-height:120px;touch-action:none}.w.full{left:0!important;top:0!important;width:100%!important;height:100%!important;z-index:9999!important;border-radius:0}.w.min{height:44px!important;min-height:44px!important}.w.min .body,.w.min .resize{display:none}.head{height:44px;display:flex;align-items:center;padding:0 9px;border-bottom:1px solid var(--line);background:#fbfdff;cursor:grab;user-select:none}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ctl{margin-left:auto;display:flex;gap:2px}.ico{border:0;background:transparent;width:29px;height:29px;cursor:pointer}.body{height:calc(100% - 44px);padding:12px;overflow:auto;touch-action:auto}.resize{position:absolute;right:0;bottom:0;width:40px;height:40px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 55%,#94a3b8 56% 62%,transparent 63% 70%,#94a3b8 71% 77%,transparent 78%)}.hero{height:100%;border:1px dashed #cbd5e1;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}.hero strong{display:block;color:var(--text);font-size:22px}.watch{display:grid;grid-template-columns:repeat(5,minmax(70px,1fr));gap:7px}.tick{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;text-align:left;cursor:pointer}.tick b{color:#1769e0;display:block}.noteT{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px}.noteB{width:100%;height:calc(100% - 48px);border:1px solid var(--line);border-radius:9px;padding:9px;resize:none;direction:rtl}.menu{position:fixed;top:62px;right:12px;z-index:15000;display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-width:210px;box-shadow:0 7px 22px rgba(15,23,42,.13)}.menu.show{display:block}.menu button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:8px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 12px;border-radius:9px;opacity:0;transition:.2s;z-index:30000}.toast.show{opacity:1}.cap{position:fixed;inset:60px 0 0;display:none;z-index:20000;background:rgba(15,23,42,.03);cursor:crosshair;touch-action:none}.cap.show{display:block}.sel{position:absolute;border:2px solid var(--accent);background:rgba(23,105,224,.09)}@media(max-width:900px){.brand{font-size:13px}.top{gap:4px;padding:7px}.btn{padding:7px 8px}}</style></head><body><div class="top"><div class="brand">Market Research Workspace — V5</div><button class="btn" id="panels">Panels</button><button class="btn" id="save">Save</button><button class="btn" id="reset">Reset Layout</button><button class="btn" id="undo">Undo</button><button class="btn" id="redo">Redo</button><button class="btn primary" id="capture">✎ Capture</button></div><div class="menu" id="menu"></div><main id="ws"></main><div class="cap" id="cap"><div class="sel" id="sel"></div></div><div class="toast" id="toast"></div><script>const $=s=>document.querySelector(s),ws=$('#ws');const S={widgets:[],history:[],future:[],notes:{title:'یادداشت بازار',body:''},active:'AMZN'};const C=x=>JSON.parse(JSON.stringify(x));function T(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}function D(){const W=Math.max(980,ws.clientWidth),H=Math.max(650,ws.clientHeight),g=12,right=Math.round(W*.31),left=W-right-g*3,top=Math.max(176,Math.round(H*.19)),lower=Math.max(150,Math.round(H*.20)),mainH=Math.max(260,H-top-lower-g*3),u=left-g*3,wl=Math.round(u*.44),cal=Math.round(u*.15),yt=Math.round(u*.14),note=u-wl-cal-yt;return[{id:'watch',title:'Watchlist',type:'watch',x:g,y:g,w:wl,h:top},{id:'cal',title:'Economic Calendar',type:'cal',x:g+wl+g,y:g,w:cal,h:top},{id:'yt',title:'YouTube',type:'yt',x:g+wl+cal+g*2,y:g,w:yt,h:top},{id:'notes',title:'My Notes',type:'notes',x:g+wl+cal+yt+g*3,y:g,w:note,h:top},{id:'market',title:'Yahoo Finance / Market',type:'market',x:g,y:top+g*2,w:left,h:mainH},{id:'chatgpt',title:'ChatGPT',type:'chatgpt',x:left+g*2,y:g,w:right,h:H-g*2},{id:'news',title:'Financial News',type:'news',x:g,y:top+mainH+g*3,w:Math.round(left*.62),h:lower},{id:'social',title:'Important People / X',type:'social',x:g+Math.round(left*.62)+g,y:top+mainH+g*3,w:left-Math.round(left*.62)-g,h:lower}]}function snap(){return C({widgets:S.widgets,notes:S.notes,active:S.active})}function hist(){S.history.push(snap());if(S.history.length>50)S.history.shift();S.future=[]}function save(){localStorage.setItem('mw-v5',JSON.stringify(snap()));T('Saved')}function load(){try{const x=JSON.parse(localStorage.getItem('mw-v5'));if(x)Object.assign(S,x)}catch{}if(!S.widgets.length)S.widgets=D()}function body(w){if(w.type==='watch')return'<div class="watch">'+['AMZN','NVDA','INTC','AAPL','MSFT'].map(t=>`<button class="tick" data-t="${t}"><b>${t}</b><span>Demo</span><br><small>not live</small></button>`).join('')+'</div>';if(w.type==='notes')return`<input class="noteT" id="nt" value="${S.notes.title}"><textarea class="noteB" id="nb" placeholder="یادداشت بنویسید...">${S.notes.body}</textarea>`;if(w.type==='market')return`<div class="hero"><div><strong>Yahoo Finance / Market</strong><b style="font-size:34px">${S.active}</b><div>Main research panel</div></div></div>`;if(w.type==='chatgpt')return'<div class="hero"><div><strong>ChatGPT</strong><div>Analysis / research / captured selections</div><small>AI connection comes next</small></div></div>';if(w.type==='cal')return'<div class="hero"><b>Economic Calendar</b></div>';if(w.type==='yt')return'<div class="hero"><b>YouTube</b></div>';if(w.type==='news')return'<div class="hero"><b>Financial News</b></div>';return'<div class="hero"><b>X / Important People</b></div>'}function render(){ws.innerHTML='';S.widgets.forEach((w,i)=>{const e=document.createElement('section');e.className='w'+(w.full?' full':'')+(w.min?' min':'');if(w.hidden)e.style.display='none';e.dataset.id=w.id;e.style.cssText+=`left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px;z-index:${i+1}`;e.innerHTML=`<div class="head"><span class="title">${w.title}</span><div class="ctl"><button class="ico" data-a="lock">${w.lock?'🔒':'🔓'}</button><button class="ico" data-a="min">—</button><button class="ico" data-a="full">⛶</button><button class="ico" data-a="hide">×</button></div></div><div class="body">${body(w)}</div><div class="resize"></div>`;ws.appendChild(e);bind(e,w)});document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.active=b.dataset.t;save();render()});const nt=$('#nt'),nb=$('#nb');if(nt)nt.oninput=()=>{S.notes.title=nt.value;localStorage.setItem('mw-v5',JSON.stringify(snap()))};if(nb)nb.oninput=()=>{S.notes.body=nb.value;localStorage.setItem('mw-v5',JSON.stringify(snap()))};menu()}function bind(e,w){const h=e.querySelector('.head'),r=e.querySelector('.resize');let d=null;h.onpointerdown=ev=>{if(w.lock||w.full||ev.target.closest('button'))return;hist();h.setPointerCapture(ev.pointerId);d={x:ev.clientX,y:ev.clientY,ox:w.x,oy:w.y}};h.onpointermove=ev=>{if(!d||d.resize)return;w.x=Math.max(0,Math.min(ws.clientWidth-w.w,d.ox+ev.clientX-d.x));w.y=Math.max(0,Math.min(ws.clientHeight-44,d.oy+ev.clientY-d.y));e.style.left=w.x+'px';e.style.top=w.y+'px'};h.onpointerup=()=>{d=null;save()};r.onpointerdown=ev=>{if(w.lock||w.full)return;hist();r.setPointerCapture(ev.pointerId);d={x:ev.clientX,y:ev.clientY,ow:w.w,oh:w.h,resize:1}};r.onpointermove=ev=>{if(!d?.resize)return;w.w=Math.max(180,Math.min(ws.clientWidth-w.x,d.ow+ev.clientX-d.x));w.h=Math.max(120,Math.min(ws.clientHeight-w.y,d.oh+ev.clientY-d.y));e.style.width=w.w+'px';e.style.height=w.h+'px'};r.onpointerup=()=>{d=null;save()};e.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{hist();const a=b.dataset.a;if(a==='lock')w.lock=!w.lock;if(a==='min')w.min=!w.min;if(a==='full')w.full=!w.full;if(a==='hide')w.hidden=true;render();save()})}function menu(){const m=$('#menu');m.innerHTML='<b style="display:block;padding:7px">Show / hide panels</b>';S.widgets.forEach(w=>{const b=document.createElement('button');b.textContent=(w.hidden?'Show ':'Hide ')+w.title;b.onclick=()=>{hist();w.hidden=!w.hidden;render();save()};m.appendChild(b)})}$('#panels').onclick=()=>$('#menu').classList.toggle('show');$('#save').onclick=save;$('#reset').onclick=()=>{hist();S.widgets=D();render();save()};$('#undo').onclick=()=>{if(!S.history.length)return;S.future.push(snap());Object.assign(S,S.history.pop());render();save()};$('#redo').onclick=()=>{if(!S.future.length)return;S.history.push(snap());Object.assign(S,S.future.pop());render();save()};let st=null,rect=null;const cap=$('#cap'),sel=$('#sel');$('#capture').onclick=()=>{cap.classList.add('show');sel.style.display='none';T('Select a region with pen, touch or mouse')};cap.onpointerdown=e=>{cap.setPointerCapture(e.pointerId);st={x:e.clientX,y:e.clientY};sel.style.display='block'};cap.onpointermove=e=>{if(!st)return;const x=Math.min(st.x,e.clientX),y=Math.min(st.y,e.clientY),w=Math.abs(e.clientX-st.x),h=Math.abs(e.clientY-st.y);rect={x,y,w,h};sel.style.cssText=`left:${x}px;top:${y-60}px;width:${w}px;height:${h}px`};cap.onpointerup=()=>{if(rect&&rect.w>15&&rect.h>15){S.notes.body+=(S.notes.body?'\n':'')+`[Capture ${Math.round(rect.w)}×${Math.round(rect.h)}]`;save();render();T('Capture reference added to Notes')}cap.classList.remove('show');st=null;rect=null};load();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script><script src="./app-config.js"></script></body></html>
